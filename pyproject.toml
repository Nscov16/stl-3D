[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stl-assembly-demo"
version = "0.1.0"
description = "Local-millimeter STL section preview and bounded trapezoid machining"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["manifold3d==3.2.1", "numpy==2.0.2"]

[project.optional-dependencies]
demo = ["Pillow>=10.1"]

[project.scripts]
stl-preview = "preview:main"
stl-machine = "machine:main"

[tool.setuptools]
py-modules = ["preview", "machine", "stl", "igs", "mesh_boolean"]
